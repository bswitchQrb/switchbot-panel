<!-- OG 画像の元データ。qlmanage が正方形で書き出すため 1200x1200 で描き、中央の 1200x630 を切り抜いて public/og.png にする -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a52"/>
      <stop offset="1" stop-color="#e5484d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f7b731"/>
    </radialGradient>
    <clipPath id="band"><rect y="285" width="1200" height="630"/></clipPath>
  </defs>
  <g clip-path="url(#band)">
    <rect y="285" width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1040" cy="375" r="260" fill="#ffffff" opacity=".07"/>
    <circle cx="140" cy="885" r="200" fill="#ffffff" opacity=".06"/>
  </g>
  <g transform="translate(427 385) scale(5.4)">
    <path d="M32 12 10.5 30.5H18V50h28V30.5h7.5z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="38" r="6" fill="url(#glow)"/>
  </g>
  <text x="600" y="830" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">SwitchBot Panel</text>
</svg>
